name: Tests

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - master
      - dev

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: false

jobs:
  standard:
    strategy:
      fail-fast: false
      matrix:
        os: ['windows-2022', 'macos-13']
        python: ['3.10', '3.11', '3.12', '3.13', '3.14.0-alpha.7', 'pypy3.9-v7.3.16', 'pypy3.10-v7.3.17']

    name: "Python ${{ matrix.python }} / ${{ matrix.os }}"
    runs-on: ${{ matrix.os }}

    steps:
    - name: set up python ${{ matrix.python }}
      uses: actions/setup-python@v5.4.0
      with:
        python-version: ${{ matrix.python }}

    - name: info
      run: python --version && cmake --version

    - name: install dependencies
      run: python -m pip install --upgrade pip setuptools wheel build

    - name: checkout
      uses: actions/checkout@v4.1.1

    - name: update submodules
      run: git submodule update --init --recursive

    - name: build ${{ matrix.python }} ${{ matrix.os }}
      run: python -m build

    - name: install package
      run: |
        pip install dist/*.whl

    - name: test python ${{ matrix.python }} ${{ matrix.os }}
      run: |
        cd tests/python
        python -m unittest discover
